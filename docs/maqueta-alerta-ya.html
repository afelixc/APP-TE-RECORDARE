<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Alerta Ya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>
/* El teléfono con la app adentro, igual que la versión anterior: barra azul, contenido blanco, cinco botones abajo. */
:root{
  --fondo:#e8ebf2; --texto:#1f2a4a; --suave:#5b6585; --marco:#1b2340;
  --azul:#2c3a66; --naranja:#e8a33d; --pantalla:#ffffff; --gris:#e6e7ee; --gris2:#f2f3f7; --linea:#c9ccd8;
  --rojo:#d32f2f; --verde:#2e8b57; --lila:#dfe3f5; --tinta:#1d1d23;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--fondo);color:var(--texto);font-family:var(--font);margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tinta)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.aviso{max-width:390px;width:100%;font-size:13px;line-height:1.4;color:var(--suave);text-align:center;margin:0;text-wrap:balance}
.aviso b{color:var(--texto)}
.marco{position:relative;width:min(390px,100%);flex:1 1 auto;min-height:560px;max-height:840px;border:8px solid var(--marco);border-radius:34px;overflow:hidden;background:var(--pantalla);box-shadow:0 12px 40px rgba(20,28,60,.25)}
#tel{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--tinta);font-size:15px}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

/* barra de arriba */
.barra{flex:none;height:58px;background:var(--azul);color:#fff;display:flex;align-items:center;padding:0 8px;gap:4px}
.barra .tit{flex:1;text-align:center;font-weight:700;font-size:24px;letter-spacing:.06em}
.barra .mic{width:40px;height:40px;border-radius:50%;background:var(--naranja);display:grid;place-items:center;color:#fff}
.barra .hueco{width:40px}
.barra .pts{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.barra .pts:hover{background:rgba(255,255,255,.12)}
.barra2{flex:none;height:58px;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px;border-bottom:1px solid transparent}
.barra2 .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--tinta)}
.barra2 .ib:hover{background:var(--gris2)}
.barra2 .nom{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:21px;overflow:hidden}
.barra2 .nom span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cont{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 16px;position:relative}
.cont.sinpad{padding:0}

/* barra de abajo */
.nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr 9px 1fr 1fr;align-items:end;background:#eceef3;padding:8px 2px 10px}
.nav .sep{width:1px;height:38px;background:#c5c9d6;justify-self:center;align-self:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#3a3f52;position:relative;min-width:0;transition:transform .15s ease}
.nav .pill{width:52px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--c)}
.nav button.propio .lab{color:var(--c);font-weight:500}
.nav button.propio .pill{background:color-mix(in srgb,var(--c) 12%,transparent)}
.nav button[aria-current="page"]{transform:scale(1.12);font-weight:700;color:var(--c)}
.nav button[aria-current="page"] .pill{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.nav button[aria-current="page"] .lab{font-weight:700;color:var(--c)}
.nav .badge{position:absolute;top:-5px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.paleta{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}
.paleta button{width:40px;height:40px;border-radius:50%;background:var(--c)}
.paleta button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.muestra{display:flex;align-items:center;gap:12px;border:1px solid #d6d9e3;border-radius:14px;padding:12px 14px;background:var(--gris2)}
.muestra .ms{color:var(--c);font-size:28px}
.muestra b{color:var(--c);font-weight:500;font-size:16px}
/* piezas comunes */
.pildora{display:flex;align-items:center;gap:6px;height:40px;border:1px solid #6d7185;border-radius:20px;background:var(--gris);padding:0 12px;min-width:0;flex:1}
.pildora input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15.5px}
.pildora .ms{font-size:20px;color:#444}
.btnBorde{height:38px;border:1px solid #7b7f92;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;padding:0 12px;background:#fff;white-space:nowrap}
.btnBorde.on{background:var(--lila);border-color:#8b90a8}
.btnBorde .ms{font-size:20px}
.cuadBtn{width:44px;height:40px;border-radius:12px;background:var(--lila);display:grid;place-items:center;color:var(--azul);flex:none}
.cuadBtn.on{background:var(--azul);color:#fff}
.seccion{font-size:13px;letter-spacing:.06em;color:#4a4f60;margin:14px 2px 8px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.seccion button{display:flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.06em}
.vacio{color:#6b7083;text-align:center;padding:40px 10px;font-size:15px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#2b2f3f;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* recuadros de carpeta y nota */
.grilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{position:relative;text-align:left;border:2px solid var(--kb);background:var(--kf,#fff);border-radius:14px;padding:12px 12px 12px;min-height:122px;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.rec .arr{display:flex;align-items:center;gap:6px;color:var(--kb);height:30px}
.rec .arr .ms{font-size:30px}
.rec .arr .sub{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:700}
.rec .arr .sub .ms{font-size:18px}
.rec .engr{position:absolute;top:10px;right:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--kb)}
.rec .engr:hover{background:rgba(0,0,0,.06)}
.rec .nombre{color:var(--kn,var(--kb));font-weight:500;font-size:17px;margin-top:auto;padding-top:10px;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec .prev{font-size:12.5px;color:#1d1d23;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rec .est{font-size:13px;margin-top:4px;font-weight:500}
.est.pend{color:var(--rojo);background:#fde0e6;padding:2px 9px;border-radius:10px;width:fit-content} .est.ok{color:var(--verde);font-weight:700} .est.gris{color:#6b7083;font-weight:400}
.rec .donde{font-size:11.5px;color:#6b7083}
.k-verde{--kb:#2e7d4f;--kn:#2e7d4f}.k-amarillo{--kb:#e0b000;--kn:#9a7500}.k-azul{--kb:#2f6db5;--kn:#2f6db5}.k-rojo{--kb:#c62828;--kn:#c62828}.k-violeta{--kb:#6a4fb3;--kn:#6a4fb3}.k-naranja{--kb:#e07b00;--kn:#b86400}.k-gris{--kb:#7d8296;--kn:#3d4152}
.fo-blanco{--kf:#fff}.fo-amarillo{--kf:#fbf3dc}.fo-verde{--kf:#e0efe6}.fo-azul{--kf:#e3ecf7}.fo-rosa{--kf:#fde4ec}.fo-violeta{--kf:#ece6f7}.fo-gris{--kf:#f2f3f7}
.menuPop{position:absolute;z-index:30;background:#eef0f6;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.22);padding:6px 0;min-width:190px}
.menuPop button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;text-align:left;font-size:15px}
.menuPop button:hover{background:#dfe2ec}
.menuPop .tick{margin-left:auto;color:var(--azul)}

/* tareas */
.listaT{border:1px solid #efe1b0;border-radius:12px;overflow:hidden}
.filaT{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-top:1px solid #f1e8c8;min-height:52px}
.filaT:first-child{border-top:0}
.filaT .n{width:20px;text-align:right;font-size:15px;color:#333}
.chk{width:20px;height:20px;border:2px solid #3b3f4e;border-radius:3px;flex:none;position:relative;background:#fff}
.chk.on{background:var(--azul);border-color:var(--azul)}
.chk.on::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.filaT .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15.5px}
.filaT .txt .cuando{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#b26a00;margin-top:2px}
.filaT .txt .cuando .ms{font-size:15px}
.filaT.hecha .txt{text-decoration:line-through;color:#888}
.engT{width:36px;height:36px;border-radius:8px;background:#ececf2;display:grid;place-items:center;flex:none}
.engT .ms{font-size:20px}
.bloqueT.abierto{background:#dfe3ef}
.bloqueT.abierto .engT{background:var(--azul);color:#fff}
.accT{display:flex;justify-content:flex-end;gap:8px;padding:0 10px 12px}
.accT button{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;border:1.5px solid}
.accT .a-sub{color:#4a8bd6;border-color:#9cc0ea;background:#e7f0fb}.accT .a-sub:disabled{opacity:.4;cursor:default}
.accT .a-baj{color:#1e63c4;border-color:#4a8bd6;background:#dce9f9}
.accT .a-edi{color:#2e7d32;border-color:#4caf50;background:#e3f2e4}
.accT .a-son{color:#f08c00;border-color:#ffb74d;background:#fff0dc}
.accT .a-arc{color:#5b6585;border-color:#9aa0b4;background:#eceef3}
.accT .a-bor{color:#c62828;border-color:#e57373;background:#fbe4e4}
.accT .a-bor.seguro{background:#c62828;color:#fff}
.filaT input{flex:1;min-width:0;height:36px;border:1px solid #8b90a8;border-radius:8px;padding:0 10px}
.abajo{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid #eef0f4}
.abajo .pildora{height:38px;background:var(--gris)}
.redondo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.redondo.verde{background:#a5d6a7}.redondo.verde.on{background:#43a047}
.redondo.nar{background:var(--naranja)}
.redondo.azul{background:var(--azul)}

/* mensaje */
.tarjR{border:1.5px solid #4caf50;border-radius:14px;padding:12px 14px;background:#f6f7fb}
.tarjR .q{font-weight:500;font-size:16px}
.tarjR .w{display:flex;justify-content:space-between;align-items:center;color:#333;font-size:14.5px;margin-top:4px}
.tarjR .act{color:#2e9b4f;display:flex;align-items:center;gap:4px;font-size:15px}
.tarjR .act .ms{font-size:20px}
.tarjR .bots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 10px;padding-bottom:10px;border-bottom:1px solid #d8dbe5}
.prio{display:flex;align-items:center;gap:14px;font-size:11.5px;letter-spacing:.08em;color:#333;font-weight:500}
.prio button{width:26px;height:26px;border-radius:50%}
.prio button.on{outline:3px solid #1d1d23;outline-offset:0}
.p0{background:#2e8b57}.p1{background:#c98400}.p2{background:#d94040}
.ayudaP{font-size:12px;color:#444;margin:8px 0 6px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.campana{display:grid;place-items:center;color:#e3e4ea;flex:1}
.campana .ms{font-size:96px}
.micGrande{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px;font-size:15px;color:#333}
.micGrande button{width:92px;height:92px;border-radius:50%;background:var(--naranja);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(232,163,61,.4)}
.micGrande button .ms{font-size:40px}
.micGrande.chico button{width:64px;height:64px}.micGrande.chico button .ms{font-size:30px}.micGrande.chico{font-size:12.5px}

/* almanaque */
.mes{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mes .t{font-size:21px}
.mes .ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.mes .hoy{color:var(--azul);font-size:15px;padding:6px 8px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.dias .cab{font-weight:500;font-size:14px;color:#333;padding-bottom:8px}
.dias button{height:36px;border-radius:9px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;margin:0 4px}
.dias button.hoyD{background:var(--naranja);color:#fff;font-weight:700;border:2px solid #2c3a66}
.dias button.sel{background:#dfe8f8;font-weight:700}
.dias button .pt{width:4px;height:4px;border-radius:50%;background:#333;position:absolute;bottom:4px}
.diaTit{font-size:17px;margin:18px 0 8px}

/* listado */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #7b7f92;border-radius:18px;overflow:hidden}
.seg button{height:32px;font-size:13.5px;border-left:1px solid #7b7f92}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--lila)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.chips button{height:34px;border-radius:17px;border:1px solid #9aa0b4;font-size:14.5px}
.chips button.on{background:var(--lila);border-color:var(--lila);font-weight:500}
.tarjL{display:flex;align-items:flex-start;gap:12px;background:var(--gris2);border:1px solid #dcdfe8;border-radius:14px;padding:12px;margin-top:8px}
.tarjL .circ{width:20px;height:20px;border-radius:50%;border:2px solid #333;margin-top:12px;flex:none;position:relative}
.tarjL .circ.on{background:var(--verde);border-color:var(--verde)}
.tarjL .circ.on::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tarjL .mid{flex:1;min-width:0}
.tarjL .q{font-weight:500;overflow-wrap:anywhere}
.tarjL.hecho .q{text-decoration:line-through;color:#777}
.tarjL .w{font-size:13px;color:#444;margin-top:4px;display:flex;align-items:center;gap:6px}
.tarjL .w .pp{width:9px;height:9px;border-radius:50%}
.tarjL .ac{display:flex;gap:4px;align-self:flex-end}
.tarjL .ac button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.tarjL .ac .ms{font-size:20px}

/* hojas */
.velo{position:absolute;inset:0;background:rgba(20,22,35,.45);z-index:50;display:flex;align-items:flex-end}
.hoja{width:100%;background:#f2f3f8;border-radius:26px 26px 0 0;padding:10px 18px 18px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.hoja .asa{width:34px;height:4px;border-radius:2px;background:#444;margin:4px auto 4px}
.hoja h3{margin:4px 0 0;font-weight:400;font-size:21px}
.hoja .opc{display:flex;align-items:center;gap:18px;padding:12px 4px;font-size:16px;text-align:left;border-radius:8px}
.hoja .opc:hover{background:#e3e5ee}
.hoja .opc.rojo{color:var(--tinta)} .hoja .opc.rojo .ms{color:var(--rojo)}
.hoja .opc.seguro{background:var(--rojo);color:#fff}.hoja .opc.seguro .ms{color:#fff}
.fld{position:relative;border:1px solid #6d7185;border-radius:6px;background:#e8e9f0;min-width:0}
.fld.foc{border:2px solid var(--azul)}
.fld label{position:absolute;top:-9px;left:10px;font-size:12px;background:linear-gradient(#f2f3f8 50%,#e8e9f0 50%);padding:0 4px;color:#333}
.fld input,.fld select{width:100%;height:50px;border:0;background:none;padding:0 12px;outline:none;font-size:16px}
.fila2{display:flex;gap:8px}
.fila2>*{flex:1}
.btnH{height:46px;border-radius:23px;font-size:16px;border:1px solid #7b7f92;background:transparent}
.btnH.pri{background:var(--azul);color:#fff;border-color:var(--azul);font-weight:500}
.colores{display:flex;gap:10px;flex-wrap:wrap}
.colores button{width:38px;height:38px;border-radius:50%;background:var(--kf,#fff);border:3px solid var(--kb,#c9ccd8)}
.colores.fondos button{border-width:1.5px}
.hoja .sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#4a4f60;margin-top:2px}
.colores button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--azul)}
.rapidos{display:flex;gap:8px;flex-wrap:wrap}
.rapidos button{height:34px;border-radius:17px;border:1px solid #9aa0b4;padding:0 12px;font-size:14px;background:#fff}

/* editor de nota */
.edTop{flex:none;display:flex;align-items:center;gap:4px;padding:6px 6px;border-bottom:1px solid #e6e7ee}
.edTop .ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.edTop .ib:hover{background:var(--gris2)}
#titulo{flex:1;min-width:0;border:0;outline:none;font-size:23px;font-weight:500;background:none;padding:6px 4px}
#titulo::placeholder{color:#9a9fb0}
#cuerpo{outline:none;font-size:16.5px;line-height:1.55;min-height:100%;padding:12px 18px 40px}
#cuerpo:empty::before{content:"Escribí la nota…";color:#9a9fb0}
#cuerpo>div{min-height:1.55em}
#cuerpo .may{text-transform:uppercase}
#cuerpo .sub{text-decoration:underline;text-underline-offset:3px}
#cuerpo .neg{font-weight:700}
#cuerpo .t-chica{font-size:13.5px}#cuerpo .t-mediana{font-size:20px}#cuerpo .t-grande{font-size:25px;font-weight:500}
.c-rojo{color:#d32f2f}.c-azul{color:#1e63c4}.c-verde{color:#2e7d32}.c-naranja{color:#e07b00}.c-violeta{color:#6a4fb3}
.f-amarillo{background:#ffe98a}.f-verde{background:#c3efc9}.f-rosa{background:#ffd1e1}.f-celeste{background:#cfe6ff}
#cuerpo [class*="f-"]{width:fit-content;max-width:100%;padding:0 3px}
#cuerpo .cb{position:relative;padding-left:34px}
#cuerpo .cb .box{position:absolute;left:4px;top:.22em;width:19px;height:19px;border:2px solid #3b3f4e;border-radius:3px;cursor:pointer;background:#fff}
#cuerpo .cb.hecho .box{background:var(--azul);border-color:var(--azul)}
#cuerpo .cb.hecho .box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
#cuerpo .cb.hecho{text-decoration:line-through;color:#777}

<p class="aviso"><b>Alerta Ya · prueba en la compu</b><br>La IA es de mentira: lo que escribas queda como recordatorio (si decís «mañana» o «a las 18», lo respeta). El micrófono y los avisos se prueban en el teléfono.</p>
<div class="marco"><div id="tel"></div></div>

<script>
(function(){
const CLAVE='alertaya-app-v2';
const tel=document.getElementById('tel');
const I=(n,f)=>`<span class="ms${f?' f':''}" aria-hidden="true">${n}</span>`;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,a,b)=>n===1?`1 ${a}`:`${n} ${b}`;
const COLORES=['verde','amarillo','azul','rojo','violeta','naranja','gris'];
const FONDOS=['blanco','amarillo','verde','azul','rosa','violeta','gris'];
const COLMAP={verde:'#2e7d4f',amarillo:'#e0b000',azul:'#2f6db5',rojo:'#c62828',violeta:'#6a4fb3',naranja:'#e07b00',gris:'#7d8296'};
const colorDe=it=>it.color||(it.tipo==='nota'?'amarillo':'verde');
const claseDe=it=>`k-${colorDe(it)} fo-${it.fondo||'blanco'}`;
const C_LETRA=['rojo','azul','verde','naranja','violeta'];
const C_FONDO=['amarillo','verde','rosa','celeste'];
const TAMS=[['t-chica','Chica'],['','Normal'],['t-mediana','Mediana'],['t-grande','Grande']];
const PRIO_TXT=['Suena 1 vez, a la hora.','Suena 3 veces, cada 5 minutos.','Suena hasta que lo apagues.'];
const REP=['No se repite','Todos los días','Todas las semanas','Todos los meses'];

function enDias(d,h,m=0){const x=new Date();x.setDate(x.getDate()+d);x.setHours(h,m,0,0);return x.toISOString()}
function cbx(t,h){return `<div class="cb${h?' hecho':''}"><span class="box" contenteditable="false"></span>${esc(t)}</div>`}
function ejemplo(){
  const gen=uid(),trab=uid(),tGen=uid(),tCasa=uid(),r1=uid();
  const e={
    rec:[{id:r1,que:'Llamar a Juan por el presupuesto',fecha:enDias(1,20),rep:0,prio:0,sil:false,hecho:false}],
    ultimo:r1,
    notas:[
      {id:uid(),tipo:'nota',nombre:'Compras del súper',padre:null,html:'<div class="t-mediana neg">Lunes</div>'+cbx('Pan')+cbx('Café',true)+cbx('Leche')+'<div class="f-amarillo">Ojo: pedir factura</div><div class="c-rojo neg">Sin TACC</div><div class="sub">Llevar bolsas</div>'},
      {id:gen,tipo:'carpeta',nombre:'Casa',padre:null},
      {id:uid(),tipo:'nota',nombre:'Ideas para el finde',padre:null,html:'<div>Ir a la costanera si no llueve.</div><div>Llamar a la abuela el domingo.</div>'},
      {id:trab,tipo:'carpeta',nombre:'Trabajo',padre:null},
      {id:uid(),tipo:'nota',nombre:'Arreglos',padre:gen,html:cbx('Cambiar el cuerito de la canilla')+cbx('Pintar la reja')},
      {id:uid(),tipo:'nota',nombre:'Wi-Fi',padre:gen,html:'<div class="t-mediana">Red: CasaAFC</div><div>La clave está abajo del router.</div>'},
      {id:uid(),tipo:'nota',nombre:'Reunión del lunes',padre:trab,html:'<div class="may f-amarillo">Temas</div>'+cbx('Revisar el servidor',true)+cbx('Pasar el presupuesto',true)}
    ],
    tareas:[
      {id:tGen,tipo:'carpeta',nombre:'General',padre:null},
      {id:tCasa,tipo:'carpeta',nombre:'Casa',padre:null},
      {id:uid(),tipo:'carpeta',nombre:'Trabajo',padre:null},
      {id:uid(),tipo:'tarea',nombre:'Comprar filamento',padre:tGen,hecha:false,rec:null},
      {id:uid(),tipo:'tarea',nombre:'Pagar el gas',padre:tGen,hecha:false,rec:null},
      {id:uid(),tipo:'tarea',nombre:'Arreglar la persiana',padre:tCasa,hecha:false,rec:null},
      {id:uid(),tipo:'tarea',nombre:'Sacar la basura',padre:tCasa,hecha:true,rec:null}
    ]
  };
  const ahora=Date.now();e.notas.forEach((x,i)=>x.creado=ahora-i*864e5);e.tareas.forEach((x,i)=>x.creado=ahora-i*864e5);
  e.cfg={colNotas:'#d99a00',colTareas:'#2e8b57'};return e;
}
let D;try{D=JSON.parse(localStorage.getItem(CLAVE))}catch(e){}
if(!D||!D.tareas)D=ejemplo();
(function(){const ahora=Date.now();['notas','tareas'].forEach(k=>D[k].forEach((x,i)=>{if(!x.creado)x.creado=ahora-(D[k].length-i)*6e4}));
  D.cfg=Object.assign({colNotas:'#d99a00',colTareas:'#2e8b57'},D.cfg||{})})();
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(D))}catch(e){}}

const S={tab:'mensaje',verUlt:false,menu:null,
  alm:{y:new Date().getFullYear(),m:new Date().getMonth(),sel:new Date().toDateString()},
  lis:{est:'pend',cuando:'todos',q:''},
  notas:{car:null,q:'',filtro:'todo',editando:null,nueva:false},
  tareas:{car:null,q:'',abierta:null,edit:null,verHechas:true},config:false};

/* ---------- fechas ---------- */
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hh(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function cuando(iso){const d=new Date(iso),h=new Date();const a=new Date(h);a.setDate(h.getDate()+1);
  let dia=d.toDateString()===h.toDateString()?'hoy':d.toDateString()===a.toDateString()?'mañana':`${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
  return `${dia} · ${hh(d)} h`}
function localVal(iso){const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString()}

/* ---------- conteos ---------- */
function contar(html){const t=document.createElement('div');t.innerHTML=html||'';
  const tot=t.querySelectorAll('.cb').length,h=t.querySelectorAll('.cb.hecho').length;
  const prev=[...t.children].map(d=>d.textContent.trim()).filter(Boolean).slice(0,3).join(' · ');
  return {tot,pend:tot-h,prev}}
function hijos(l,p){return l.filter(x=>x.padre===p)}
const porFecha=(a,b)=>(b.creado||0)-(a.creado||0);
function desc(l,id){const o=[];(function r(p){hijos(l,p).forEach(h=>{o.push(h);r(h.id)})})(id);return o}
function buscar(l,id){return l.find(x=>x.id===id)}
function pendTareas(){return D.tareas.filter(t=>t.tipo==='tarea'&&!t.hecha).length}
function pendDe(n){return n.tipo==='nota'?contar(n.html).pend:desc(D.notas,n.id).filter(x=>x.tipo==='nota').reduce((a,x)=>a+contar(x.html).pend,0)}
function pendNotas(){return hijos(D.notas,null).filter(n=>pendDe(n)>0).length}

/* ---------- toast ---------- */
let tt;function toast(m){const v=tel.querySelector('.toast');if(v)v.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;tel.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2600)}

/* ---------- armado general ---------- */
function barraAzul(){return `<div class="barra">${S.tab==='mensaje'?'<span class="hueco"></span>':`<button class="mic" data-a="mic" aria-label="Hablar">${I('mic',1)}</button>`}
  <div class="tit">ALERTA YA</div><button class="pts" data-a="pts" aria-label="Más opciones">${I('more_vert')}</button></div>`}
function nav(){
  const b=[['mensaje','Mensaje','chat'],['almanaque','Almanaque','calendar_month'],['listado','Listado','checklist'],['notas','Notas','sticky_note_2'],['tareas','Tareas','task_alt']];
  const bad={notas:pendNotas(),tareas:pendTareas()};
  const col={mensaje:'#2c3a66',almanaque:'#2c3a66',listado:'#2c3a66',notas:D.cfg.colNotas,tareas:D.cfg.colTareas};
  return `<nav class="nav">${b.map(([k,t,i],n)=>`${n===3?'<span class="sep" aria-hidden="true"></span>':''}<button data-a="tab" data-v="${k}" style="--c:${col[k]}" class="${k==='notas'||k==='tareas'?'propio':''}" ${S.tab===k?'aria-current="page"':''}><span class="pill">${I(i,S.tab===k)}</span><span class="lab">${t}</span>${bad[k]?`<span class="badge">${bad[k]}</span>`:''}</button>`).join('')}</nav>`;
}
function render(){
  const foco=document.activeElement&&document.activeElement.id&&tel.contains(document.activeElement)?{id:document.activeElement.id,p:document.activeElement.selectionStart}:null;
  if(S.config){tel.innerHTML=pantConfig();return}
  if(S.tab==='notas'&&S.notas.editando){editor();return}
  let h='';
  if(S.tab==='mensaje')h=barraAzul()+pantMensaje();
  if(S.tab==='almanaque')h=barraAzul()+pantAlmanaque();
  if(S.tab==='listado')h=barraAzul()+pantListado();
  if(S.tab==='notas')h=pantNotas();
  if(S.tab==='tareas')h=pantTareas();
  tel.innerHTML=h+nav()+menuTres();
  if(foco){const e=document.getElementById(foco.id);if(e){e.focus();try{e.setSelectionRange(foco.p,foco.p)}catch(x){}}}
  if(S.tareas.edit){const e=document.getElementById('editT');if(e&&document.activeElement!==e){e.focus();e.select()}}
}
function menuTres(){return S.menu==='pts'?`<div class="menuPop" style="top:8px;right:8px"><button data-a="config">${I('settings')} Configuración</button><button data-a="ejemplos">${I('lightbulb')} Ejemplos</button></div>`:''}

/* ---------- MENSAJE ---------- */
function pantMensaje(){
  const r=buscar(D.rec,D.ultimo);
  let h=`<div class="cont" style="display:flex;flex-direction:column">
    <div class="fila2"><button class="btnBorde ${S.verUlt?'on':''}" data-a="verUlt">${I('history')} Último recordatorio</button><button class="btnBorde" data-a="cargar">${I('edit_calendar')} Cargar a mano</button></div>`;
  if(S.verUlt){
    h+=r?`<div class="tarjR" style="margin-top:12px"><div class="q">${esc(r.que)}</div>
      <div class="w"><span>${cuando(r.fecha)}</span><span class="act">${I(r.hecho?'task_alt':'check_circle',1)} ${r.hecho?'Hecho':'Activo'}</span></div>
      <div class="bots"><button class="btnBorde" data-a="cancelarR" data-id="${r.id}">${I('close')} Cancelar</button><button class="btnBorde on" style="border-color:var(--lila)" data-a="modR" data-id="${r.id}">${I('edit',1)} Modificar</button></div>
      ${prioHtml(r.prio,r.id)}<div class="ayudaP">${PRIO_TXT[r.prio]}</div>
      <label class="check"><span class="chk ${r.sil?'on':''}" data-a="silR" data-id="${r.id}"></span>${I('notifications_off')} Sonar aunque esté en silencio</label></div>`
      :`<div class="vacio">Todavía no cargaste ningún recordatorio.</div>`;
    h+=`<div style="flex:1"></div><div class="micGrande chico"><button data-a="mic" aria-label="Hablar">${I('mic',1)}</button>Tocá para hablar</div>`;
  }else{
    h+=`<div class="campana">${I('notifications',1)}</div><div class="micGrande"><button data-a="mic" aria-label="Hablar">${I('mic',1)}</button>Tocá para hablar</div>`;
  }
  h+=`</div><form class="abajo" data-f="msg" style="border:0"><label class="pildora" style="height:44px;border:0"><input id="msgIn" placeholder="O escribilo acá…" autocomplete="off">${I('mic')}</label><button class="redondo azul">${I('send',1)}</button></form>`;
  return h;
}
function prioHtml(p,id){return `<div class="prio">PRIORIDAD ${[0,1,2].map(i=>`<button class="p${i} ${p===i?'on':''}" data-a="prioR" data-id="${id||''}" data-v="${i}" aria-label="Prioridad ${['normal','media','alta'][i]}"></button>`).join('')}</div>`}

function iaFalsa(txt){
  const t=txt.toLowerCase();let d=new Date();let dia=1,h=9,m=0;
  if(/\bhoy\b/.test(t))dia=0;if(/pasado mañana/.test(t))dia=2;else if(/mañana/.test(t))dia=1;
  const mh=t.match(/a las (\d{1,2})(?::(\d{2}))?/);if(mh){h=+mh[1];m=+(mh[2]||0);if(/tarde|noche/.test(t)&&h<12)h+=12;if(!/mañana|pasado/.test(t)&&!/\bhoy\b/.test(t)){dia=0;const x=new Date();x.setHours(h,m,0,0);if(x<new Date())dia=1}}
  let que=txt.replace(/\b(recordame|recordar|avisame)\b/gi,'').replace(/pasado mañana|mañana|\bhoy\b/gi,'').replace(/a las \d{1,2}(:\d{2})?( de la (tarde|noche|mañana))?/gi,'').replace(/\s+/g,' ').trim();
  que=que.charAt(0).toUpperCase()+que.slice(1);
  return {id:uid(),que:que||txt,fecha:enDias(dia,h,m),rep:0,prio:0,sil:false,hecho:false};
}

/* ---------- ALMANAQUE ---------- */
function pantAlmanaque(){
  const {y,m}=S.alm;const pri=new Date(y,m,1);const off=(pri.getDay()+6)%7;const nd=new Date(y,m+1,0).getDate();
  const hoy=new Date().toDateString();
  const conRec=new Set(D.rec.filter(r=>!r.hecho).map(r=>new Date(r.fecha).toDateString()));
  let h=`<div class="cont"><div class="mes"><button class="ib" data-a="mes" data-v="-1" aria-label="Mes anterior">${I('chevron_left')}</button>
    <span class="t">${MESES[m][0].toUpperCase()+MESES[m].slice(1)} ${y}</span><button class="ib" data-a="mes" data-v="1" aria-label="Mes siguiente">${I('chevron_right')}</button><button class="hoy" data-a="mesHoy">Hoy</button></div>
    <div class="dias">${['L','M','M','J','V','S','D'].map(x=>`<div class="cab">${x}</div>`).join('')}${'<div></div>'.repeat(off)}`;
  for(let d=1;d<=nd;d++){const ds=new Date(y,m,d).toDateString();
    h+=`<button data-a="dia" data-v="${ds}" class="${ds===hoy?'hoyD':ds===S.alm.sel?'sel':''}">${d}${conRec.has(ds)?'<span class="pt"></span>':''}</button>`}
  const sel=new Date(S.alm.sel);
  const delDia=D.rec.filter(r=>new Date(r.fecha).toDateString()===S.alm.sel).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const nom=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][sel.getDay()];
  h+=`</div><div class="diaTit">${nom} ${sel.getDate()} de ${MESES[sel.getMonth()]}</div>`;
  h+=delDia.length?delDia.map(tarjL).join(''):`<div style="font-size:14.5px">Sin recordatorios este día.</div>`;
  return h+`</div>`;
}

/* ---------- LISTADO ---------- */
function tarjL(r){return `<div class="tarjL ${r.hecho?'hecho':''}"><button class="circ ${r.hecho?'on':''}" data-a="hechoR" data-id="${r.id}" aria-label="Marcar hecho"></button>
  <div class="mid"><div class="q">${esc(r.que)}</div><div class="w"><span class="pp p${r.prio}"></span>${cuando(r.fecha)}${r.rep?' · '+REP[r.rep].toLowerCase():''}</div></div>
  <div class="ac"><button data-a="modR" data-id="${r.id}" aria-label="Modificar">${I('edit')}</button><button data-a="borrarR" data-id="${r.id}" aria-label="Borrar">${I('delete')}</button></div></div>`}
function pantListado(){
  const L=S.lis;const ahora=new Date();const hoy=ahora.toDateString();
  let base=D.rec.filter(r=>L.est==='todos'||(L.est==='pend'?!r.hecho:r.hecho));
  if(L.q.trim())base=base.filter(r=>r.que.toLowerCase().includes(L.q.trim().toLowerCase()));
  const pas=base.filter(r=>new Date(r.fecha)<ahora&&!r.hecho),hoyL=base.filter(r=>new Date(r.fecha).toDateString()===hoy);
  const lista=(L.cuando==='pasados'?pas:L.cuando==='hoy'?hoyL:base).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const msj={pasados:'No hay recordatorios pasados sin hacer.',hoy:'Hoy no tenés nada pendiente.',todos:'No hay recordatorios.'}[L.cuando];
  return `<div class="cont"><div class="seg">${[['pend','Pendientes'],['hechos','Hechos'],['todos','Todos']].map(([k,t])=>`<button class="${L.est===k?'on':''}" data-a="lisEst" data-v="${k}">${t}</button>`).join('')}</div>
    <div class="fila2" style="margin-top:10px;align-items:center"><label class="pildora">${I('search')}<input id="lisQ" placeholder="Buscar…" value="${esc(L.q)}" autocomplete="off"></label><button class="ib" data-a="cargar" aria-label="Cargar a mano" style="flex:none;width:40px;height:40px;display:grid;place-items:center">${I('playlist_add')}</button></div>
    <div class="chips"><button class="${L.cuando==='pasados'?'on':''}" data-a="lisC" data-v="pasados">Pasados (${pas.length})</button><button class="${L.cuando==='hoy'?'on':''}" data-a="lisC" data-v="hoy">Hoy (${hoyL.length})</button><button class="${L.cuando==='todos'?'on':''}" data-a="lisC" data-v="todos">Todos (${base.length})</button></div>
    ${lista.length?lista.map(tarjL).join(''):`<div class="vacio" style="padding-top:120px">${msj}</div>`}</div>`;
}

/* ---------- NOTAS ---------- */
function recNota(n,q){
  const c=contar(n.html);
  const est=c.tot?(c.pend?`<div class="est pend">${plural(c.pend,'pendiente','pendientes')}</div>`:`<div class="est ok">Todo hecho ✓</div>`):`<div class="est gris">Nota</div>`;
  return `<div class="rec ${claseDe(n)}" role="button" tabindex="0" data-a="abrirNota" data-id="${n.id}">
    <div class="arr">${I('description',1)}</div><button class="engr" data-a="engr" data-l="notas" data-id="${n.id}" aria-label="Ajustes">${I('settings',1)}</button>
    <div class="nombre">${esc(n.nombre||'Sin título')}</div><div class="prev">${esc(c.prev)}</div>${q&&n.padre?`<div class="donde">en ${esc(buscar(D.notas,n.padre).nombre)}</div>`:''}${est}</div>`;
}
function recCarpeta(c,lista,q,tipo){
  const dentro=desc(lista,c.id);const subs=hijos(lista,c.id).filter(x=>x.tipo==='carpeta').length;
  let pend,tot;
  if(tipo==='notas'){const ns=dentro.filter(x=>x.tipo==='nota');tot=ns.length;pend=ns.reduce((a,n)=>a+contar(n.html).pend,0);var algunCb=ns.some(n=>contar(n.html).tot)}
  else{const ts=dentro.filter(x=>x.tipo==='tarea');tot=ts.length;pend=ts.filter(t=>!t.hecha).length;var algunCb=tot>0}
  const est=pend?`<div class="est pend">${plural(pend,'pendiente','pendientes')}</div>`:algunCb?`<div class="est ok">Todo hecho ✓</div>`:`<div class="est gris">${tot?(tipo==='notas'?plural(tot,'nota','notas'):plural(tot,'tarea','tareas')):'Vacía'}</div>`;

    <div class="nombre">${esc(c.nombre)}</div>${q&&c.padre?`<div class="donde">en ${esc(buscar(lista,c.padre).nombre)}</div>`:''}${est}</div>`;
}
function cabeceraCarpeta(lista,car,extra){
  const c=buscar(lista,car);

function pantTareas(){
  const T=S.tareas;const q=T.q.trim().toLowerCase();
  let h=T.car?cabeceraCarpeta(D.tareas,T.car,`<button class="ib" data-a="engr" data-l="tareas" data-id="${T.car}" aria-label="Nombre y color">${I('settings')}</button><button class="ib" data-a="borrarCarT" aria-label="Borrar carpeta">${I('delete')}</button>`):barraAzul();
  const nomC=T.car?buscar(D.tareas,T.car).nombre:'';
  h+=`<div class="cont"><div class="fila2" style="align-items:center">
    <label class="pildora">${I('search')}<input id="tarQ" placeholder="${T.car?'Buscar en '+esc(nomC)+'…':'Buscar…'}" value="${esc(T.q)}" autocomplete="off"></label>
    ${T.car?'':`<button class="cuadBtn" style="flex:none;width:86px;border-radius:20px" data-a="nuevaCarT" aria-label="Carpeta nueva">${I('create_new_folder')}</button>`}</div>`;
  if(!T.car&&!q){
    const cs=D.tareas.filter(x=>x.tipo==='carpeta').sort(porFecha);
    h+=cs.length?`<div class="grilla" style="margin-top:12px">${cs.map(c=>recCarpeta(c,D.tareas,'','tareas')).join('')}</div>`
      :`<div class="vacio">Todavía no hay carpetas.<br>Tocá ${I('create_new_folder')} para crear la primera.</div>`;
    return h+`</div>`;
  }
  let ts=q?D.tareas.filter(t=>t.tipo==='tarea'&&(!T.car||t.padre===T.car)&&t.nombre.toLowerCase().includes(q)):hijos(D.tareas,T.car).filter(t=>t.tipo==='tarea');
  if(q&&!T.car){const cs=D.tareas.filter(x=>x.tipo==='carpeta'&&x.nombre.toLowerCase().includes(q));if(cs.length)h+=`<div class="grilla" style="margin-top:12px">${cs.map(c=>recCarpeta(c,D.tareas,'','tareas')).join('')}</div>`}
  const pend=ts.filter(t=>!t.hecha),hechas=ts.filter(t=>t.hecha);
  h+=`<div class="seccion">Para hacer (${pend.length})</div>`+(pend.length?`<div class="listaT">${pend.map((t,i)=>filaTarea(t,i,pend.length,q)).join('')}</div>`:`<div style="font-size:14px;color:#6b7083;padding:4px 2px">${q?'No hay tareas con eso.':'No hay nada para hacer. Escribila o dictala abajo.'}</div>`);
  if(hechas.length)h+=`<div class="seccion"><button data-a="verHechas">${I(T.verHechas?'expand_less':'expand_more')} Completadas (${hechas.length})</button></div>`+(T.verHechas?`<div class="listaT" style="border-color:#dcdfe8">${hechas.map((t,i)=>filaTarea(t,i,hechas.length,q)).join('')}</div>`:'');
  h+=`</div>`;
  if(T.car)h+=`<form class="abajo" data-f="tarea"><label class="pildora"><input id="tarIn" placeholder="Escribí o dictá tareas para hacer…" autocomplete="off"></label>
    <button class="redondo verde ${S.hayTexto?'on':''}" aria-label="Agregar">${I('check')}</button><button type="button" class="redondo nar" data-a="mic" aria-label="Dictar">${I('mic',1)}</button></form>`;
  return h;
}
function filaTarea(t,i,n,q){
  const ab=S.tareas.abierta===t.id;const r=t.rec&&buscar(D.rec,t.rec);
  const txt=S.tareas.edit===t.id?`<form data-f="editT" data-id="${t.id}" style="flex:1;display:flex"><input id="editT" value="${esc(t.nombre)}"></form>`
    :`<div class="txt">${esc(t.nombre)}${r&&!r.hecho&&!t.hecha?`<div class="cuando">${I('notifications_active',1)} ${cuando(r.fecha)}</div>`:''}${q&&!S.tareas.car?`<div class="cuando" style="color:#6b7083">en ${esc(buscar(D.tareas,t.padre).nombre)}</div>`:''}</div>`;
  const acc=t.hecha
    ?`<button class="a-arc" data-a="desarchivarT" data-id="${t.id}" aria-label="Volver a para hacer">${I('unarchive',1)}</button><button class="a-bor" data-a="borrarT" data-id="${t.id}" aria-label="Borrar">${I('delete',1)}</button>`
    :`<button class="a-sub" data-a="moverT" data-v="-1" data-id="${t.id}" ${i===0?'disabled':''} aria-label="Subir">${I('arrow_upward')}</button>
      <button class="a-baj" data-a="moverT" data-v="1" data-id="${t.id}" ${i===n-1?'disabled':''} aria-label="Bajar">${I('arrow_downward')}</button>
      <button class="a-edi" data-a="editarT" data-id="${t.id}" aria-label="Editar">${I('edit',1)}</button>
      <button class="a-son" data-a="sonarT" data-id="${t.id}" aria-label="Programar para que suene">${I('notifications_active',1)}</button>
      <button class="a-arc" data-a="archivarT" data-id="${t.id}" aria-label="Archivar (completada)">${I('archive',1)}</button>
      <button class="a-bor" data-a="borrarT" data-id="${t.id}" aria-label="Borrar">${I('delete',1)}</button>`;
  return `<div class="bloqueT ${ab?'abierto':''}"><div class="filaT ${t.hecha?'hecha':''}"><span class="n">${i+1}.</span>
    <button class="chk ${t.hecha?'on':''}" data-a="tildarT" data-id="${t.id}" aria-label="Tildar"></button>${txt}
    <button class="engT" data-a="engT" data-id="${t.id}" aria-label="Opciones">${I('settings',1)}</button></div>
    ${ab?`<div class="accT">${acc}</div>`:''}</div>`;
}

/* ---------- hojas ---------- */
function hoja(html,montar){
  const v=document.createElement('div');v.className='velo';v.innerHTML=`<div class="hoja" role="dialog"><div class="asa"></div>${html}</div>`;
  v.addEventListener('mousedown',e=>{if(e.target===v)cerrar()});tel.appendChild(v);
  function cerrar(){v.remove();render()}
  montar(v.firstChild,cerrar);
}
function hojaRecordatorio(r,despues){
  const nuevo=!r;r=r||{id:uid(),que:'',fecha:enDias(0,new Date().getHours()+1),rep:0,prio:0,sil:false,hecho:false};

    <div class="fld"><label for="hRep">Repetir</label><select id="hRep">${REP.map((t,i)=>`<option value="${i}" ${r.rep===i?'selected':''}>${t}</option>`).join('')}</select></div>
    <div id="hPrio">${prioHtml(prio)}</div><div class="ayudaP" id="hPT" style="margin:0">${PRIO_TXT[prio]}</div>

    <div class="fila2" style="margin-top:6px"><button class="btnH" data-x="no">Cancelar</button><button class="btnH pri" data-x="ok">Guardar</button></div>`,
  (el,cerrar)=>{
    const que=el.querySelector('#hQue');setTimeout(()=>que.focus(),20);
    el.querySelector('#hPrio').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;prio=+b.dataset.v;el.querySelector('#hPrio').innerHTML=prioHtml(prio);el.querySelector('#hPT').textContent=PRIO_TXT[prio]};
    const s=el.querySelector('#hSil');s.parentNode.onclick=()=>{sil=!sil;s.classList.toggle('on',sil)};
    el.querySelector('[data-x="no"]').onclick=cerrar;
    el.querySelector('[data-x="ok"]').onclick=()=>{
      const qv=que.value.trim();if(!qv){que.focus();que.placeholder='Escribí qué te recuerdo';return}
      const f=new Date(el.querySelector('#hDia').value+'T'+(el.querySelector('#hHora').value||'09:00'));
      Object.assign(r,{que:qv,fecha:isNaN(f)?r.fecha:f.toISOString(),rep:+el.querySelector('#hRep').value,prio,sil});
      if(nuevo){D.rec.push(r);D.ultimo=r.id}guardar();if(despues)despues(r);cerrar();toast(`Listo: ${cuando(r.fecha)}`)};
  });
}
function hojaSonar(t){
  const r=t.rec&&buscar(D.rec,t.rec);const base=r?r.fecha:enDias(1,9);const lv=localVal(base);
  hoja(`<h3>¿Qué día y hora te aviso?</h3><div style="font-size:14px;color:#444">«${esc(t.nombre)}»</div>
    <div class="rapidos"><button data-q="1h">En 1 hora</button><button data-q="tarde">Hoy 18:00</button><button data-q="man">Mañana 9:00</button></div>
    <div class="fila2"><div class="fld" style="flex:1.6"><label for="sDia">Día</label><input id="sDia" type="date" value="${lv.slice(0,10)}"></div><div class="fld"><label for="sHora">Hora</label><input id="sHora" type="time" value="${lv.slice(11,16)}"></div></div>
    <div class="fila2">${r?'<button class="btnH" data-x="quitar" style="color:var(--rojo)">Que no suene</button>':'<button class="btnH" data-x="no">Cancelar</button>'}<button class="btnH pri" data-x="ok">Programar</button></div>`,
  (el,cerrar)=>{
    const poner=iso=>{const v=localVal(iso);el.querySelector('#sDia').value=v.slice(0,10);el.querySelector('#sHora').value=v.slice(11,16)};
    el.querySelector('.rapidos').onclick=e=>{const k=e.target.dataset.q;if(k==='1h')poner(new Date(Date.now()+36e5).toISOString());if(k==='tarde')poner(enDias(0,18));if(k==='man')poner(enDias(1,9))};
    const no=el.querySelector('[data-x="no"]');if(no)no.onclick=cerrar;
    const qu=el.querySelector('[data-x="quitar"]');if(qu)qu.onclick=()=>{D.rec=D.rec.filter(x=>x.id!==t.rec);t.rec=null;guardar();cerrar();toast('Ya no suena')};
    el.querySelector('[data-x="ok"]').onclick=()=>{
      const f=new Date(el.querySelector('#sDia').value+'T'+el.querySelector('#sHora').value);if(isNaN(f))return;
      if(r){r.fecha=f.toISOString();r.que=t.nombre;r.hecho=false}else{const n={id:uid(),que:t.nombre,fecha:f.toISOString(),rep:0,prio:0,sil:false,hecho:false,tarea:t.id};D.rec.push(n);t.rec=n.id;D.ultimo=n.id}
      S.tareas.abierta=null;guardar();cerrar();toast(`Va a sonar ${cuando(f.toISOString())}`)};
  });
}

function borrarItem(lista,item){
  const ids=new Set([item.id,...desc(lista,item.id).map(x=>x.id)]);
  for(let i=lista.length-1;i>=0;i--)if(ids.has(lista[i].id)){if(lista[i].rec)D.rec=D.rec.filter(r=>r.id!==lista[i].rec);lista.splice(i,1)}

}

  try{document.execCommand('defaultParagraphSeparator',false,'div')}catch(e){}
  if(S.notas.nueva){tit.focus();S.notas.nueva=false}
  const g=()=>{n.nombre=tit.value.trim();n.html=cu.innerHTML;guardar()};
  const salir=()=>{g();if(!n.nombre&&!cu.textContent.trim()&&!cu.querySelector('.cb'))D.notas.splice(D.notas.indexOf(n),1);guardar();S.notas.editando=null;render()};
  document.getElementById('edAtras').onclick=salir;
  const bb=document.getElementById('edBorrar');
  bb.onclick=()=>{if(!bb.dataset.s){bb.dataset.s=1;bb.style.background='var(--rojo)';bb.style.color='#fff';toast('Tocá otra vez para borrar la nota');return}D.notas.splice(D.notas.indexOf(n),1);guardar();S.notas.editando=null;render()};
  tit.oninput=g;
  tit.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();cu.focus();if(!cu.firstChild)cu.innerHTML='<div><br></div>';colocar(cu.firstChild,0)}};
  function colocar(nd,o){const r=document.createRange();r.setStart(nd,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  let ultimo=null;
  function bloque(){const s=getSelection();if(!s.rangeCount||!cu.contains(s.anchorNode))return null;let x=s.anchorNode;
    if(x===cu)x=cu.childNodes[Math.min(s.anchorOffset,cu.childNodes.length-1)]||null;
    while(x&&x.parentNode!==cu)x=x.parentNode;
    if(x&&x.nodeType===3){const d=document.createElement('div');cu.insertBefore(d,x);d.appendChild(x);colocar(x,x.length);x=d}
    return x}
  const onSel=()=>{if(!document.body.contains(cu)){document.removeEventListener('selectionchange',onSel);return}const b=bloque();if(b){ultimo=b;marcar()}};
  document.addEventListener('selectionchange',onSel);
  function normalizar(){[...cu.childNodes].forEach(nd=>{if(nd.nodeType===3&&nd.textContent.trim()){const d=document.createElement('div');cu.insertBefore(d,nd);d.appendChild(nd)}});
    cu.querySelectorAll(':scope>div.cb').forEach(d=>{if(!d.querySelector('.box'))d.classList.remove('cb','hecho')})}
  cu.addEventListener('input',()=>{normalizar();g()});
  cu.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
  cu.addEventListener('mousedown',e=>{if(e.target.classList.contains('box')){e.preventDefault();e.target.parentNode.classList.toggle('hecho');g()}});
  cu.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const b=bloque();if(!b||!b.classList.contains('cb'))return;e.preventDefault();
    if(!b.textContent.trim()){b.classList.remove('cb','hecho');b.querySelector('.box').remove();if(!b.textContent)b.innerHTML='<br>';colocar(b,0);g();marcar();return}
    const d=document.createElement('div');d.className=b.className.replace(/\bhecho\b/,'').trim();d.innerHTML='<span class="box" contenteditable="false"></span><br>';b.after(d);colocar(d,1);ultimo=d;g()});
  function marcar(){const c=ultimo&&ultimo.classList;['cb','may','sub','neg'].forEach(k=>herr.querySelector(`[data-h="${k}"]`).setAttribute('aria-pressed',!!(c&&c.contains(k))))}
  let pop=null;const cerrarPop=()=>{if(pop){pop.remove();pop=null}};
  herr.addEventListener('mousedown',e=>e.preventDefault());
  herr.addEventListener('click',e=>{
    let b=ultimo&&cu.contains(ultimo)?ultimo:null;
    if(!b){cu.focus();if(!cu.firstChild)cu.innerHTML='<div><br></div>';normalizar();b=cu.lastChild;colocar(b,b.childNodes.length);ultimo=b}
    const sw=e.target.closest('[data-p]');
    if(sw){const [tipo,val]=sw.dataset.p.split(':');const pre={tam:'t-',fondo:'f-',color:'c-'}[tipo];[...b.classList].filter(c=>c.startsWith(pre)).forEach(c=>b.classList.remove(c));if(val)b.classList.add(val);cerrarPop();g();return}
    const h=e.target.closest('[data-h]');if(!h)return;const k=h.dataset.h;
    if(k==='cb'){if(b.classList.contains('cb')){b.classList.remove('cb','hecho');b.querySelector('.box')?.remove();if(!b.textContent)b.innerHTML='<br>'}
      else{b.classList.add('cb');const s=document.createElement('span');s.className='box';s.contentEditable='false';b.prepend(s);if(b.childNodes.length===1)b.appendChild(document.createElement('br'));colocar(b,b.lastChild.nodeName==='BR'?b.childNodes.length-1:b.childNodes.length)}
      cerrarPop();g();marcar();return}
    if(['may','sub','neg'].includes(k)){b.classList.toggle(k);cerrarPop();g();marcar();return}
    const ya=pop&&pop.dataset.k===k;cerrarPop();if(ya)return;
    pop=document.createElement('div');pop.className='pop';pop.dataset.k=k;const t=c=>b.classList.contains(c);
    if(k==='tam')pop.innerHTML='<div class="rot">Tamaño de letra</div>'+TAMS.map(([c,x])=>`<button class="tam" data-p="tam:${c}" aria-pressed="${c?t(c):!TAMS.some(y=>y[0]&&t(y[0]))}">${x}</button>`).join('');
    if(k==='color')pop.innerHTML='<div class="rot">Color de letra</div><button class="sw" data-p="color:" aria-label="Negro">A</button>'+C_LETRA.map(c=>`<button class="sw c-${c}" data-p="color:c-${c}" aria-pressed="${t('c-'+c)}" aria-label="${c}">A</button>`).join('');
    if(k==='fondo')pop.innerHTML='<div class="rot">Color de fondo</div><button class="sw" data-p="fondo:" aria-label="Sin fondo">'+I('format_color_reset')+'</button>'+C_FONDO.map(c=>`<button class="sw f-${c}" data-p="fondo:f-${c}" aria-pressed="${t('f-'+c)}" aria-label="${c}"></button>`).join('');
    herr.appendChild(pop);
  });
}

/* ---------- toques ---------- */
tel.addEventListener('click',e=>{
  if(e.target.closest('.velo')||e.target.closest('#herr')||e.target.closest('.edTop'))return;
  const el=e.target.closest('[data-a]');
  if(!el){if(S.menu){S.menu=null;render()}return}
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  if(a!=='menu'&&a!=='pts')S.menu=null;
  const r=id&&buscar(D.rec,id);
  switch(a){
    case 'tab':S.tab=v;S.config=false;S.cfgVista=null;if(v==='notas'&&S.tab===v){}break;
    case 'pts':S.menu=S.menu==='pts'?null:'pts';break;
    case 'menu':S.menu=S.menu===v?null:v;break;
    case 'config':S.config=true;break;
    case 'cerrarConfig':S.config=false;S.cfgVista=null;break;
    case 'cfgColores':S.cfgVista='colores';break;
    case 'cfgVolver':S.cfgVista=null;break;
    case 'colNav':D.cfg[el.dataset.k]=v;guardar();break;
    case 'colReset':D.cfg={colNotas:'#d99a00',colTareas:'#2e8b57'};guardar();break;
    case 'cfgItem':toast('Esta parte queda igual que antes: se prueba en el teléfono');return;
    case 'ejemplos':render();hojaEjemplos();return;
    case 'mic':toast('En la compu el micrófono no anda: se prueba en el teléfono. Escribilo abajo.');return;
    case 'verUlt':S.verUlt=!S.verUlt;break;
    case 'cargar':hojaRecordatorio(null,()=>{S.verUlt=true});return;
    case 'modR':hojaRecordatorio(r);return;
    case 'cancelarR':D.rec=D.rec.filter(x=>x.id!==id);D.tareas.forEach(t=>{if(t.rec===id)t.rec=null});D.ultimo=D.rec.length?D.rec[D.rec.length-1].id:null;guardar();toast('Recordatorio cancelado');break;
    case 'prioR':if(r){r.prio=+v;guardar()}break;
    case 'silR':r.sil=!r.sil;guardar();break;
    case 'hechoR':r.hecho=!r.hecho;D.tareas.forEach(t=>{if(t.rec===id)t.hecha=r.hecho});guardar();break;
    case 'borrarR':D.rec=D.rec.filter(x=>x.id!==id);D.tareas.forEach(t=>{if(t.rec===id)t.rec=null});guardar();toast('Borrado');break;
    case 'mes':{let m=S.alm.m+Number(v),y=S.alm.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.alm.m=m;S.alm.y=y;break}
    case 'mesHoy':{const h=new Date();S.alm={y:h.getFullYear(),m:h.getMonth(),sel:h.toDateString()};break}
    case 'dia':S.alm.sel=v;break;
    case 'lisEst':S.lis.est=v;break;
    case 'lisC':S.lis.cuando=v;break;
    case 'filtroN':S.notas.filtro=v;break;
    case 'nuevaCarN':render();hojaNombre(D.notas,{id:uid(),tipo:'carpeta',nombre:'',padre:S.notas.car},true);return;
    case 'nuevaNota':{const n={id:uid(),tipo:'nota',nombre:'',padre:S.notas.car,html:'',creado:Date.now()};D.notas.push(n);S.notas.editando=n.id;S.notas.nueva=true;break}
    case 'abrirNota':if(e.target.closest('.engr'))return;S.notas.editando=id;break;
    case 'abrirCar':if(e.target.closest('.engr'))return;if(S.tab==='notas'){S.notas.car=id;S.notas.q=''}else{S.tareas.car=id;S.tareas.q='';S.tareas.abierta=null}break;
    case 'atrasCar':{const L=S.tab==='notas'?D.notas:D.tareas,o=S.tab==='notas'?S.notas:S.tareas;const c=buscar(L,o.car);o.car=c?c.padre:null;o.q='';break}
    case 'engr':{e.stopPropagation();const L=el.dataset.l==='notas'?D.notas:D.tareas;hojaEngranaje(L,buscar(L,id),el.dataset.l);return}
    case 'nuevaCarT':render();hojaNombre(D.tareas,{id:uid(),tipo:'carpeta',nombre:'',padre:null},true);return;
    case 'borrarCarT':{const c=buscar(D.tareas,S.tareas.car);if(!el.dataset.s){el.dataset.s=1;el.style.background='var(--rojo)';el.style.color='#fff';toast(`Tocá otra vez para borrar «${c.nombre}» con todo lo de adentro`);return}const p=c.padre;borrarItem(D.tareas,c);S.tareas.car=p;break}
    case 'verHechas':S.tareas.verHechas=!S.tareas.verHechas;break;
    case 'tildarT':{const t=buscar(D.tareas,id);t.hecha=!t.hecha;const rr=t.rec&&buscar(D.rec,t.rec);if(rr)rr.hecho=t.hecha;S.tareas.abierta=null;guardar();break}
    case 'engT':S.tareas.abierta=S.tareas.abierta===id?null:id;S.tareas.edit=null;break;
    case 'moverT':{const t=buscar(D.tareas,id);const her=D.tareas.filter(x=>x.tipo==='tarea'&&x.padre===t.padre&&x.hecha===t.hecha);const i=her.indexOf(t),j=i+Number(v);if(j<0||j>=her.length)break;
      const a1=D.tareas.indexOf(t),a2=D.tareas.indexOf(her[j]);[D.tareas[a1],D.tareas[a2]]=[D.tareas[a2],D.tareas[a1]];guardar();break}
    case 'editarT':S.tareas.edit=id;break;
    case 'archivarT':case 'desarchivarT':{const t=buscar(D.tareas,id);t.hecha=a==='archivarT';const rr=t.rec&&buscar(D.rec,t.rec);if(rr)rr.hecho=t.hecha;S.tareas.abierta=null;guardar();toast(t.hecha?'Archivada: quedó abajo, en Completadas':'Volvió a Para hacer');break}
    case 'sonarT':hojaSonar(buscar(D.tareas,id));return;
    case 'borrarT':if(!el.classList.contains('seguro')){el.classList.add('seguro');toast('Tocá otra vez el tacho para borrarla');return}
      {const t=buscar(D.tareas,id);if(t.rec)D.rec=D.rec.filter(x=>x.id!==t.rec);D.tareas.splice(D.tareas.indexOf(t),1);S.tareas.abierta=null;guardar()}break;
  }
  render();
});
tel.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});
tel.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='lisQ'){S.lis.q=e.target.value;render()}
  if(id==='notQ'){S.notas.q=e.target.value;render()}
  if(id==='tarQ'){S.tareas.q=e.target.value;render()}
  if(id==='tarIn'){const on=!!e.target.value.trim();if(on!==!!S.hayTexto){S.hayTexto=on;const b=tel.querySelector('.redondo.verde');if(b)b.classList.toggle('on',on)}}
});
tel.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.f==='msg'){const i=f.querySelector('input');const t=i.value.trim();if(!t)return;const r=iaFalsa(t);D.rec.push(r);D.ultimo=r.id;S.verUlt=true;guardar();render();toast(`Listo: «${r.que}» ${cuando(r.fecha)}`)}
  if(f.dataset.f==='tarea'){const i=f.querySelector('input');const lineas=i.value.split(/[\n;]+/).map(x=>x.trim()).filter(Boolean);if(!lineas.length)return;
    lineas.forEach(l=>D.tareas.push({id:uid(),tipo:'tarea',nombre:l.charAt(0).toUpperCase()+l.slice(1),padre:S.tareas.car,hecha:false,rec:null,creado:Date.now()}));S.hayTexto=false;guardar();render();const n=document.getElementById('tarIn');if(n)n.focus()}
  if(f.dataset.f==='editT'){const t=buscar(D.tareas,f.dataset.id);const v=f.querySelector('input').value.trim();if(v){t.nombre=v;const rr=t.rec&&buscar(D.rec,t.rec);if(rr)rr.que=v}S.tareas.edit=null;S.tareas.abierta=null;guardar();render()}
});
render();
})();
</script>
